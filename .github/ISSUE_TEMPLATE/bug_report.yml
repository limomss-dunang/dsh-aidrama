name: Bug report / 问题反馈
description: 报告可复现的问题（解析、校验、生成、界面）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请把「哪个阶段 + 项目里的哪一项 + 报错原文」写全；涉及项目数据的，请删掉公司/人名等敏感信息。
        安全问题请走 [SECURITY.md](https://github.com/limomss-dunang/dsh-aidrama/blob/main/SECURITY.md) 的私密通道。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，和预期有什么不同
      placeholder: 例如：分镜校验一直报 GEN-005，但每集目标时长是对的
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建项目，导入剧本 xxx
        2. 预览确认 → 跑到分集 → 分镜
        3. 点「校验」→ 报错
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 新建项目 / 剧本导入解析
        - 总纲（bible）
        - 资产（角色 / 场景 / 道具）
        - 分集（episode）
        - 分镜（shots）
        - 提示词编译 / 方言
        - 生成（图片 / 视频 / TTS 音色）
        - 校验与质检
        - 导出 / 项目存储
        - 界面与交互
        - 安装与启动
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错原文 / 项目片段
      description: 校验报错、日志片段，或 project.json 里相关字段（**提交前删除敏感信息**）
      render: text
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / DSH 0.1.x / dsh-aidrama 0.2.0 / Node 22
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 issue，没有重复
          required: true
        - label: 已删除项目里的客户名、人名、密钥等敏感信息
          required: true
